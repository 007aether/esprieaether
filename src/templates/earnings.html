{% extends "base.html" %}
{% block title %}الأرباح{% endblock %}
{% block page_title %}💰 الأرباح{% endblock %}

{% block content %}

<div class="card">
  <h3 class="card-title">📡 الإيردروبات</h3>
  <div class="stat-value" id="airdrops-total">—</div>
  <div class="stat-sub">إيردروب متاح</div>
</div>

<div class="card">
  <h3 class="card-title">💰 مشاركة الإنترنت</h3>
  <div id="bandwidth-status">—</div>
</div>

<div class="card">
  <h3 class="card-title">📋 أحدث الإيردروبات</h3>
  <div id="airdrop-list"></div>
</div>

<button class="btn btn-primary" onclick="loadEarnings()">🔄 تحديث</button>

{% endblock %}

{% block scripts %}
<script>
async function loadEarnings() {
  try {
    const r = await fetch('/api/earnings');
    const d = await r.json();

    document.getElementById('airdrops-total').textContent = d.airdrops.total;

    // Bandwidth
    const bw = d.bandwidth;
    let html = '';
    if (bw.docker_available) {
      html += '<p>✅ Docker متاح</p>';
    } else {
      html += '<p>❌ Docker غير مثبت</p>';
    }
    if (bw.providers) {
      html += '<ul style="list-style: none; padding: 0;">';
      bw.providers.forEach(p => {
        const emoji = p.configured ? '✅' : '❌';
        html += `<li>${emoji} ${p.name} — ${p.payout}</li>`;
      });
      html += '</ul>';
    }
    document.getElementById('bandwidth-status').innerHTML = html;

    // Airdrops
    let list = '<table class="table"><thead><tr><th>#</th><th>العنوان</th></tr></thead><tbody>';
    d.airdrops.recent.forEach((item, i) => {
      list += `<tr><td>${i+1}</td><td><a href="${item.link}" target="_blank">${item.title.substring(0,80)}</a></td></tr>`;
    });
    list += '</tbody></table>';
    document.getElementById('airdrop-list').innerHTML = list;

  } catch (e) {
    console.error(e);
  }
}

loadEarnings();
</script>
{% endblock %}
