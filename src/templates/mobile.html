<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aether Mobile</title>
<link rel="manifest" href="/mobile/manifest.json">
<style>
  :root {
    --bg: #0b0e14;
    --card: #141923;
    --border: #232a36;
    --fg: #e6e9ef;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --ok: #2ea043;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    min-height: 100vh;
  }
  header { padding: 14px 4px 10px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  header h1 span { color: var(--accent); }
  .clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px;
  }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }
  .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .row .name { color: var(--fg); }
  .row .val { font-variant-numeric: tabular-nums; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; }
  .pill.up { background: rgba(46,160,67,.15); color: var(--ok); }
  .pill.down { background: rgba(248,81,73,.15); color: var(--err); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    flex: 1; min-width: 100px;
  }
  button:active { transform: scale(.97); opacity: .85; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--fg); }
  #log { font-size: 11px; color: var(--muted); margin-top: 8px; max-height: 120px; overflow-y: auto; font-family: ui-monospace, monospace; }
  footer { text-align: center; color: var(--muted); font-size: 10px; padding: 16px 0 8px; }
</style>
</head>
<body>

<header>
  <h1>Aether<span>Mobile</span></h1>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="grid">
  <div class="card">
    <h2>Services</h2>
    <div class="big" id="svc-count">–</div>
    <div class="sub"><span id="svc-up" class="ok">–</span> / <span id="svc-total">–</span> up</div>
  </div>
  <div class="card">
    <h2>Mesh board</h2>
    <div class="big" id="mesh-count">–</div>
    <div class="sub">agent messages</div>
  </div>

  <div class="card wide">
    <h2>Health</h2>
    <div id="health"></div>
  </div>

  <div class="card wide">
    <h2>Actions</h2>
    <div class="btns">
      <button onclick="act('mesh cycle')">Mesh cycle</button>
      <button class="ghost" onclick="act('scan')">Airdrop scan</button>
      <button class="ghost" onclick="act('board')">Board</button>
      <button class="ghost" onclick="refresh()">Refresh</button>
    </div>
    <div id="log"></div>
  </div>
</div>

<footer>EsprieAether · 24/7 · <span id="stamp">–</span></footer>

<script>
const SERVICES = [
  ['router', 11435, '/v1/models'],
  ['mesh', 11437, '/health'],
  ['web', 5000, '/health'],
  ['cloud', 5001, '/health'],
  ['sunna', 5100, '/health'],
  ['kanban', 5103, '/health'],
  ['homedock', 5104, '/health'],
];

function log(s) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.innerHTML = `[${t}] ${s}<br>` + el.innerHTML;
}

// log with pre-escaped content (board messages)
function logRaw(safeHtml) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.innerHTML = `[${t}] ${safeHtml}<br>` + el.innerHTML;
}

async function probe(port, path) {
  try {
    const r = await fetch(`http://${location.hostname}:${port}${path}`, {signal: AbortSignal.timeout(4000)});
    return r.status;
  } catch { return 0; }
}

async function refresh() {
  let up = 0;
  const rows = [];
  for (const [name, port, path] of SERVICES) {
    const code = await probe(port, path);
    const alive = code > 0;
    if (alive) up++;
    rows.push(`<div class="row"><span class="name">${name} <span class="pill ${alive?'up':'down'}">${alive?'UP':'DOWN'}</span></span><span class="val">:${port} ${code||'—'}</span></div>`);
  }
  document.getElementById('health').innerHTML = rows.join('');
  document.getElementById('svc-count').textContent = up;
  document.getElementById('svc-up').textContent = up;
  document.getElementById('svc-total').textContent = SERVICES.length;

  try {
    const r = await fetch(`http://${location.hostname}:11437/board?limit=1`);
    const d = await r.json();
    document.getElementById('mesh-count').textContent = d.total || 0;
  } catch {}

  document.getElementById('stamp').textContent = new Date().toLocaleString();
}

async function act(cmd) {
  log(`→ ${cmd} …`);
  if (cmd === 'mesh cycle') {
    log('Mesh cycle takes 2-4 min — open GitHub issue or /mesh cycle');
  } else if (cmd === 'scan') {
    log('Airdrop scan queued — see /airdrops');
  } else if (cmd === 'board') {
    try {
      const r = await fetch(`http://${location.hostname}:11437/board?limit=8`);
      const d = await r.json();
      // board text is untrusted model output → escape via textContent
      d.messages.slice(-5).forEach(m => {
        const safe = `${m.agent}: ${String(m.text).slice(0,60)}`.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
        logRaw(safe);
      });
    } catch { log('board offline'); }
  } else {
    refresh();
  }
}

setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}, 1000);

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
