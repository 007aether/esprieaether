---
# Sunna Dashboard + Executor Deployment (Port 5105)
# The Executive Director dashboard and task executor
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunna-dashboard
  namespace: esprieaether
  labels:
    app: sunna-dashboard
    component: dashboard
    version: "2.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sunna-dashboard
  template:
    metadata:
      labels:
        app: sunna-dashboard
        component: dashboard
        version: "2.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5105"
        prometheus.io/path: "/api/metrics"
    spec:
      # Anti-affinity to spread dashboard pods
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - sunna-dashboard
            topologyKey: kubernetes.io/hostname
      containers:
      - name: sunna-dashboard
        image: esprieaether-sunna:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "src/sunna_executor.py"]
        envFrom:
        - configMapRef:
            name: esprieaether-config
        - secretRef:
            name: esprieaether-secrets
        ports:
        - containerPort: 5105
          name: http
          protocol: TCP
        - containerPort: 5105
          name: websocket
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5105
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5105
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: 5105
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 15
        volumeMounts:
        - name: data
          mountPath: /data
        - name: state
          mountPath: /app/src
        - name: sunna-workspace
          mountPath: /app/Sunna-Equipe-Industrial
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sunna-dashboard-pvc
      - name: state
        emptyDir: {}
      - name: sunna-workspace
        emptyDir: {}
---
# Sunna Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: sunna-dashboard
  namespace: esprieaether
  labels:
    app: sunna-dashboard
    component: dashboard
spec:
  type: ClusterIP
  ports:
  - port: 5105
    targetPort: 5105
    name: http
    protocol: TCP
  selector:
    app: sunna-dashboard
---
# Sunna Dashboard HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sunna-dashboard-hpa
  namespace: esprieaether
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sunna-dashboard
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
# Sunna Dashboard PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sunna-dashboard-pvc
  namespace: esprieaether
  labels:
    app: sunna-dashboard
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
  volumeMode: Filesystem