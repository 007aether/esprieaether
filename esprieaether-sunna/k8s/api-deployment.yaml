---
# Sunna API Bridge Deployment (Port 5100)
# The REST API bridge exposing Sunna company data
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunna-api
  namespace: esprieaether
  labels:
    app: sunna-api
    component: api
    version: "2.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sunna-api
  template:
    metadata:
      labels:
        app: sunna-api
        component: api
        version: "2.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5100"
        prometheus.io/path: "/metrics"
    spec:
      # Anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - sunna-api
            topologyKey: kubernetes.io/hostname
      containers:
      - name: sunna-api
        image: esprieaether-sunna:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "src/sunna_api.py"]
        envFrom:
        - configMapRef:
            name: esprieaether-config
        - secretRef:
            name: esprieaether-secrets
        ports:
        - containerPort: 5100
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5100
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5100
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 5100
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        volumeMounts:
        - name: data
          mountPath: /data
        - name: sunna-workspace
          mountPath: /app/Sunna-Equipe-Industrial
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sunna-api-pvc
      - name: sunna-workspace
        emptyDir: {}
---
# Sunna API Service
apiVersion: v1
kind: Service
metadata:
  name: sunna-api
  namespace: esprieaether
  labels:
    app: sunna-api
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 5100
    targetPort: 5100
    name: http
    protocol: TCP
  selector:
    app: sunna-api
---
# Sunna API HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sunna-api-hpa
  namespace: esprieaether
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sunna-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# Sunna API PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sunna-api-pvc
  namespace: esprieaether
  labels:
    app: sunna-api
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
  volumeMode: Filesystem