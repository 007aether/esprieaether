---
# ESPRIEAETHER-SUNNA Kubernetes Secrets
# IMPORTANT: These are template values. Replace with actual secrets before deploying.
# Use: kubectl create secret generic esprieaether-secrets --from-env-file=.env
# Or deploy with external secrets operator / sealed secrets

apiVersion: v1
kind: Secret
metadata:
  name: esprieaether-secrets
  namespace: esprieaether
  labels:
    app: esprieaether-sunna
type: Opaque
stringData:
  # JWT Secret - MUST be a strong random key (min 32 chars)
  SUNNA_JWT_SECRET: "CHANGE-ME-REPLACE-WITH-32-CHAR-RANDOM-KEY"

  # Authentication passwords
  ADMIN_PASSWORD: "CHANGE-ME-REPLACE-WITH-STRONG-PASSWORD"
  API_PASSWORD: "CHANGE-ME-REPLACE-WITH-STRONG-PASSWORD"

  # GitHub Integration
  GITHUB_TOKEN: "ghp_CHANGE_ME_replace_with_your_github_token"

  # Model Providers
  OPENROUTER_API_KEY: "sk-or-v1-CHANGE_ME_replace_with_your_openrouter_key"
  VENICE_API_KEY: "venice-CHANGE_ME_replace_with_your_venice_key"

  # External Services
  HF_TOKEN: "hf_CHANGE_ME_replace_with_your_huggingface_token"
  HF_DATASET_REPO: "esprieaether/sunna-evaluation-dataset"
  NETLIFY_AUTH_TOKEN: "CHANGE_ME_replace_with_your_netlify_token"
  NETLIFY_SITE_ID: "CHANGE_ME_replace_with_your_site_id"

  # Cloudflare (for telemetry)
  CF_ACCOUNT_ID: "CHANGE_ME_replace_with_your_cf_account_id"
  CF_API_TOKEN: "CHANGE_ME_replace_with_your_cf_api_token"

---
# TLS Certificate Secret (for HTTPS ingress)
apiVersion: v1
kind: Secret
metadata:
  name: esprieaether-tls
  namespace: esprieaether
  labels:
    app: esprieaether-sunna
type: kubernetes.io/tls
data:
  # Replace with base64-encoded TLS cert and key
  # echo -n "$(cat tls.crt)" | base64
  # echo -n "$(cat tls.key)" | base64
  tls.crt: "REPLACE_WITH_BASE64_TLS_CERT"
  tls.key: "REPLACE_WITH_BASE64_TLS_KEY"

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: esprieaether-config
  namespace: esprieaether
  labels:
    app: esprieaether-sunna
data:
  # Sunna API Configuration
  SUNNA_API_PORT: "5100"
  SUNNA_DIR: "/app/Sunna-Equipe-Industrial"
  JWT_EXPIRY_HOURS: "24"
  JWT_ALGORITHM: "HS256"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_DEFAULT: "100"
  RATE_LIMIT_BURST: "20"

  # Metrics
  METRICS_ENABLED: "true"

  # Logging
  LOG_LEVEL: "INFO"

  # Dashboard Configuration
  DASHBOARD_PORT: "5105"
  DASHBOARD_HOST: "0.0.0.0"

  # Agent OS
  AGENT_OS_PORT: "8000"
  AGENT_OS_ENABLED: "true"

  # Database
  DB_PATH: "/data/esprieaether.db"

  # Feature Flags
  ENABLE_WEBSOCKET: "true"
  ENABLE_SSE: "true"
  ENABLE_BATCH_OPS: "true"
  ENABLE_ML_ROUTING: "true"
  ENABLE_AUTO_EVOLUTION: "true"

  # Evolution
  EVOLUTION_AUTO_APPLY: "false"
  EVOLUTION_MAX_FIXES_PER_CYCLE: "10"
  EVOLUTION_SCHEDULE_CRON: "0 2 * * *"

  # Colibri
  COLIBRI_PROFILE_DIR: "/data/colibri/tuning"
  COLIBRI_NO_OMP_TUNE: "false"

  # Model Providers
  LOCAL_MODEL_BASE_URL: "http://ollama:11434/v1"
  LOCAL_MODEL_API_KEY: "not-needed"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # HuggingFace
  HF_TOKEN: "hf_not_set"
  HF_DATASET_REPO: "esprieaether/sunna-evaluation-dataset"