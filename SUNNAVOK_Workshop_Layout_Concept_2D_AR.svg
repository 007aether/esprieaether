<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2500" viewBox="0 0 1900 2500">\n<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526671"/></marker></defs>\n<rect width="100%" height="100%" fill="#F5F8FA"/>\n<text x="950.0" y="78" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#0B5965" direction="rtl" unicode-bidi="plaintext">مخطط مبدئي لتنظيم ورشة SUNNA EQUIPE INDUSTRIAL</text>\n<text x="950.0" y="128" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="500" fill="#405866" direction="rtl" unicode-bidi="plaintext">المساحة 12 × 6 م = 72 م²  |  علو السقف 2.5 م  |  المخطط العلوي 2D</text>\n<rect x="165" y="160" width="1570" height="86" rx="14" fill="#FFF4D6" stroke="#E0B44D" stroke-width="2"/>\n<text x="950.0" y="214" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="600" fill="#755313" direction="rtl" unicode-bidi="plaintext">تصور أولي للمناطق فقط — مواقع الأبواب والماكينات والنوافذ والأعمدة تحتاج قياساً وتأكيداً</text>\n<rect x="350" y="300" width="900" height="1800" fill="#FFFFFF" stroke="#253A45" stroke-width="12"/>\n<text x="800.0" y="332" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="500" fill="#536771" direction="rtl" unicode-bidi="plaintext">الجدار الخلفي</text>\n<rect x="370" y="1860" width="860" height="215" rx="10" fill="#E8F4FA" stroke="#5C97B8" stroke-width="2" stroke-dasharray="10 8"/>\n<text x="800" y="1935" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#28617B" direction="rtl" unicode-bidi="plaintext">منطقة استقبال ومناولة مؤقتة</text>\n<text x="800" y="1977" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#28617B" direction="rtl" unicode-bidi="plaintext">خلّها خالية من التخزين الدائم قرب الواجهة</text>\n<rect x="735" y="790" width="135" height="1050" rx="8" fill="#EEF1F3" stroke="#72838B" stroke-width="2" stroke-dasharray="8 7"/>\n<text x="803" y="1040" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#394F59" direction="rtl" unicode-bidi="plaintext">ممر حركة</text>\n<text x="803" y="1080" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#394F59" direction="rtl" unicode-bidi="plaintext">مقترح 0.9 م</text>\n<text x="803" y="1120" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#394F59" direction="rtl" unicode-bidi="plaintext">يُراجع مع</text>\n<text x="803" y="1150" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#394F59" direction="rtl" unicode-bidi="plaintext">المناولة الفعلية</text>\n<rect x="380" y="880" width="260" height="850" rx="10" fill="#E7F0FB" stroke="#6489B8" stroke-width="3"/>\n<text x="510" y="970" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#274F7C" direction="rtl" unicode-bidi="plaintext">تخزين الحديد</text>\n<text x="510" y="1013" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#274F7C" direction="rtl" unicode-bidi="plaintext">والأنابيب</text>\n<line x1="405" y1="1080" x2="615" y2="1080" stroke="#87A8CB" stroke-width="6"/>\n<line x1="405" y1="1220" x2="615" y2="1220" stroke="#87A8CB" stroke-width="6"/>\n<line x1="405" y1="1360" x2="615" y2="1360" stroke="#87A8CB" stroke-width="6"/>\n<line x1="405" y1="1500" x2="615" y2="1500" stroke="#87A8CB" stroke-width="6"/>\n<line x1="405" y1="1640" x2="615" y2="1640" stroke="#87A8CB" stroke-width="6"/>\n<text x="510" y="1765" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#526671" direction="rtl" unicode-bidi="plaintext">رفوف منخفضة حسب علو السقف</text>\n<rect x="390" y="365" width="330" height="390" rx="10" fill="#FCE9E8" stroke="#BB5550" stroke-width="3"/>\n<text x="555" y="430" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#8C3735" direction="rtl" unicode-bidi="plaintext">منطقة لحام</text>\n<text x="555" y="472" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#8C3735">MIG / TIG</text>\n<rect x="420" y="510" width="270" height="170" rx="6" fill="#F8D6D4" stroke="#BB5550" stroke-width="2" stroke-dasharray="9 6"/>\n<text x="555" y="577" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#7A302E" direction="rtl" unicode-bidi="plaintext">طاولة/قطعة اللحام</text>\n<line x1="410" y1="705" x2="700" y2="705" stroke="#C7504D" stroke-width="5" stroke-dasharray="12 8"/>\n<text x="555" y="735" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#8C3735" direction="rtl" unicode-bidi="plaintext">ستارة حماية — موقع تقريبي</text>\n<rect x="890" y="365" width="330" height="390" rx="10" fill="#E6F4EA" stroke="#4D9163" stroke-width="3"/>\n<text x="1055" y="430" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#27603A" direction="rtl" unicode-bidi="plaintext">منطقة تجميع</text>\n<rect x="930" y="485" width="250" height="165" rx="8" fill="#D0E9D7" stroke="#4D9163" stroke-width="2"/>\n<text x="1055" y="555" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#27603A" direction="rtl" unicode-bidi="plaintext">طاولة تجميع</text>\n<text x="1055" y="602" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#3C7650" direction="rtl" unicode-bidi="plaintext">المقاس يحدد ميدانياً</text>\n<rect x="900" y="820" width="300" height="245" rx="10" fill="#F1ECFA" stroke="#8A73AE" stroke-width="3"/>\n<text x="1050" y="880" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#5D477F" direction="rtl" unicode-bidi="plaintext">طاولة عمل</text>\n<text x="1050" y="925" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#5D477F" direction="rtl" unicode-bidi="plaintext">ولوحة أدوات</text>\n<line x1="935" y1="970" x2="1165" y2="970" stroke="#A996C6" stroke-width="4"/>\n<text x="1050" y="1020" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="500" fill="#62577A" direction="rtl" unicode-bidi="plaintext">المكان النهائي حسب الصور</text>\n<rect x="900" y="1110" width="300" height="275" rx="10" fill="#FFF0DD" stroke="#C4843F" stroke-width="3"/>\n<text x="1050" y="1170" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#8B561E" direction="rtl" unicode-bidi="plaintext">القطع والجلخ</text>\n<rect x="938" y="1210" width="98" height="115" rx="8" fill="#F8D9AE" stroke="#C4843F" stroke-width="2"/>\n<text x="987" y="1275" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#754617" direction="rtl" unicode-bidi="plaintext">قطع</text>\n<rect x="1060" y="1210" width="98" height="115" rx="8" fill="#F8D9AE" stroke="#C4843F" stroke-width="2"/>\n<text x="1109" y="1275" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#754617" direction="rtl" unicode-bidi="plaintext">جلخ</text>\n<text x="1050" y="1353" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="500" fill="#805725" direction="rtl" unicode-bidi="plaintext">عزل الشرر والتهوية تُراجع</text>\n<rect x="900" y="1430" width="300" height="285" rx="10" fill="#E8F2F2" stroke="#508B8B" stroke-width="3"/>\n<text x="1050" y="1490" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#2E6666" direction="rtl" unicode-bidi="plaintext">الحفر والتجهيز</text>\n<rect x="950" y="1530" width="200" height="120" rx="8" fill="#CEE3E3" stroke="#508B8B" stroke-width="2"/>\n<text x="1050" y="1600" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#2E6666" direction="rtl" unicode-bidi="plaintext">آلة الحفر</text>\n<text x="1050" y="1680" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="500" fill="#3F7474" direction="rtl" unicode-bidi="plaintext">موقعها حول الطاولة يثبت</text>\n<line x1="350" y1="275" x2="1250" y2="275" stroke="#526671" stroke-width="3"/>\n<line x1="350" y1="257" x2="350" y2="293" stroke="#526671" stroke-width="3"/>\n<line x1="1250" y1="257" x2="1250" y2="293" stroke="#526671" stroke-width="3"/>\n<line x1="360" y1="275" x2="1240" y2="275" stroke="#526671" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>\n<text x="800.0" y="251" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#344A55" direction="rtl" unicode-bidi="plaintext">6 م</text>\n<line x1="285" y1="310" x2="285" y2="2090" stroke="#526671" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>\n<line x1="268" y1="300" x2="302" y2="300" stroke="#526671" stroke-width="3"/>\n<line x1="268" y1="2100" x2="302" y2="2100" stroke="#526671" stroke-width="3"/>\n<text x="258" y="1200.0" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#344A55" direction="rtl" unicode-bidi="plaintext">12 م</text>\n<text x="800.0" y="2145" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#0B5965" direction="rtl" unicode-bidi="plaintext">واجهة الدخول: عرضها 6 م — فيها بابان</text>\n<text x="800.0" y="2182" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#6B4F19" direction="rtl" unicode-bidi="plaintext">الباب 1 ≈ 2 م وشوية؛ عرض وموقع الباب 2 ومواقع البابين غير مثبتة</text>\n<rect x="1310" y="300" width="510" height="320" rx="14" fill="#FFFFFF" stroke="#CDD8DD" stroke-width="2"/>\n<text x="1565" y="350" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#0B5965" direction="rtl" unicode-bidi="plaintext">المعطيات المؤكدة</text>\n<text x="1780" y="410" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• أبعاد المكان: 12 × 6 م</text>\n<text x="1780" y="452" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• علو السقف: 2.5 م</text>\n<text x="1780" y="494" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• المدخل في واجهة 6 م</text>\n<text x="1780" y="536" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• واجهة المدخل فيها بابان</text>\n<text x="1780" y="578" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• أحد البابين عرضه نحو 2 م وشوية</text>\n<rect x="1310" y="650" width="510" height="355" rx="14" fill="#FFFFFF" stroke="#CDD8DD" stroke-width="2"/>\n<text x="1565" y="700" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#A04C40" direction="rtl" unicode-bidi="plaintext">معلومات خاصها تأكيد</text>\n<text x="1780" y="760" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#4B555A" direction="rtl" unicode-bidi="plaintext">• عرض ومكان الباب الثاني</text>\n<text x="1780" y="806" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#4B555A" direction="rtl" unicode-bidi="plaintext">• مواقع البابين بدقة</text>\n<text x="1780" y="852" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#4B555A" direction="rtl" unicode-bidi="plaintext">• النوافذ والأعمدة ومخارج التهوية</text>\n<text x="1780" y="898" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#4B555A" direction="rtl" unicode-bidi="plaintext">• قياسات الماكينات والطاولات</text>\n<text x="1780" y="944" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#4B555A" direction="rtl" unicode-bidi="plaintext">• قياس عرض الممر وطريقة إدخال الحديد</text>\n<rect x="1310" y="1035" width="510" height="370" rx="14" fill="#FFFFFF" stroke="#CDD8DD" stroke-width="2"/>\n<text x="1565" y="1085" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#0B5965" direction="rtl" unicode-bidi="plaintext">التوزيع المقترح</text>\n<text x="1780" y="1145" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• الحديد والأنابيب على اليسار</text>\n<text x="1780" y="1193" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• ممر وسطي واضح نحو الخلف</text>\n<text x="1780" y="1241" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• الحفر والقطع والجلخ على اليمين</text>\n<text x="1780" y="1289" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• اللحام بالخلف مع ستارة حماية</text>\n<text x="1780" y="1337" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#263D49" direction="rtl" unicode-bidi="plaintext">• التجميع بالخلف في الجهة المقابلة</text>\n<rect x="1310" y="1435" width="510" height="265" rx="14" fill="#FFF4D6" stroke="#E0B44D" stroke-width="2"/>\n<text x="1565" y="1485" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#755313" direction="rtl" unicode-bidi="plaintext">حدود هذا المخطط</text>\n<text x="1780" y="1545" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#755313" direction="rtl" unicode-bidi="plaintext">• مناطق العمل تقريبية، لا تمثل قياس الآلات</text>\n<text x="1780" y="1591" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#755313" direction="rtl" unicode-bidi="plaintext">• لم تُحدد مواقع النوافذ أو الأعمدة</text>\n<text x="1780" y="1637" text-anchor="end" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#755313" direction="rtl" unicode-bidi="plaintext">• لا يُعتمد للتثبيت قبل المعاينة</text>\n<line x1="1365" y1="1780" x2="1515" y2="1780" stroke="#263D49" stroke-width="6"/>\n<line x1="1365" y1="1768" x2="1365" y2="1792" stroke="#263D49" stroke-width="4"/>\n<line x1="1515" y1="1768" x2="1515" y2="1792" stroke="#263D49" stroke-width="4"/>\n<text x="1440" y="1820" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#344A55" direction="rtl" unicode-bidi="plaintext">1 م (مقياس الغرفة)</text>\n<text x="950.0" y="2390" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="500" fill="#60727A" direction="rtl" unicode-bidi="plaintext">SUNNAVOK | مخطط أولي قابل للتعديل بعد تثبيت القياسات والصور والمعدات</text>\n</svg>